name: build

on:
  push:
  pull_request:

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel meson ninja pkgconf dbus curl freetype2 nlohmann-json

      - name: Configure
        run: meson setup build -Dtests=true --buildtype=release

      - name: Build
        run: meson compile -C build

      - name: Unit tests
        run: meson test -C build --print-errorlogs

      - name: Smoke test
        run: ./build/lyrics-term --help | head -n 1
