name: build

on:
  push:
  pull_request:

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel cmake pkgconf dbus curl freetype2 nlohmann-json

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DLYRICS_TERM_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test
        run: ./build/lyrics-term --help | head -n 1
